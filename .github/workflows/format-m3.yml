name: Format M3

on:
  push:
    branches: [feature/m3-layout-primitives]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format Zig
        run: zig fmt zig build.zig
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "hondo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add zig build.zig
          git commit -m "chore: format M3 Zig changes"
          git push
