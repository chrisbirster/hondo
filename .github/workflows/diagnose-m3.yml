name: Repair M3

on:
  push:
    branches: [feature/m3-layout-primitives]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - run: npm install
      - name: Repair runtime compatibility and layout defaults
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          quickjs = Path('zig/src/runtime/quickjs.zig')
          text = quickjs.read_text()
          marker = '''    \\\\  };\n    \\\\}\n;\n'''
          replacement = '''    \\\\  };\n    \\\\}\n    \\\\if (typeof globalThis.console !== "object" || globalThis.console === null) {\n    \\\\  const noop = function noop() {};\n    \\\\  globalThis.console = new Proxy({}, {\n    \\\\    get: function getConsoleMethod() { return noop; },\n    \\\\  });\n    \\\\}\n;\n'''
          if marker not in text:
              raise SystemExit('quickjs bootstrap marker not found')
          text = text.replace(marker, replacement, 1)

          old_dump = '''fn dumpException(context: *c.JSContext) void {\n    const exception = c.JS_GetException(context);\n    defer c.JS_FreeValue(context, exception);\n\n    const message = c.JS_ToCString(context, exception);\n    if (message == null) return;\n    defer c.JS_FreeCString(context, message);\n\n    const zero_terminated: [*:0]const u8 = @ptrCast(message);\n    std.debug.print("Hondo QuickJS exception: {s}\\n", .{std.mem.span(zero_terminated)});\n}\n'''
          new_dump = '''fn dumpException(context: *c.JSContext) void {\n    const exception = c.JS_GetException(context);\n    defer c.JS_FreeValue(context, exception);\n\n    const message = c.JS_ToCString(context, exception);\n    if (message != null) {\n        defer c.JS_FreeCString(context, message);\n        const zero_terminated: [*:0]const u8 = @ptrCast(message);\n        std.debug.print("Hondo QuickJS exception: {s}\\n", .{std.mem.span(zero_terminated)});\n    }\n\n    const stack = c.JS_GetPropertyStr(context, exception, "stack");\n    defer c.JS_FreeValue(context, stack);\n    if (c.JS_IsUndefined(stack) == 0) {\n        const stack_text = c.JS_ToCString(context, stack);\n        if (stack_text != null) {\n            defer c.JS_FreeCString(context, stack_text);\n            const stack_zero: [*:0]const u8 = @ptrCast(stack_text);\n            std.debug.print("Hondo QuickJS stack:\\n{s}\\n", .{std.mem.span(stack_zero)});\n        }\n    }\n}\n'''
          if old_dump not in text:
              raise SystemExit('dumpException marker not found')
          quickjs.write_text(text.replace(old_dump, new_dump, 1))

          renderer = Path('zig/src/render/scene_renderer.zig')
          text = renderer.read_text()
          text = text.replace('    shrink: usize = 1,', '    shrink: usize = 0,', 1)
          text = text.replace('style.shrink = jsonUnsignedValue(json, "shrink") orelse 1;', 'style.shrink = jsonUnsignedValue(json, "shrink") orelse 0;', 1)
          renderer.write_text(text)

          Path('docs/notes/m3-test-error.txt').unlink(missing_ok=True)
          PY

          zig fmt zig build.zig
          set +e
          zig build test
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- Solid runEffect around line 2311 ---'
            nl -ba zig/src/generated/counter.js | sed -n '2298,2320p'
            echo '--- Hondo primitive around line 2923 ---'
            nl -ba zig/src/generated/counter.js | sed -n '2908,2932p'
            exit "$status"
          fi

          git config user.name "hondo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add zig/src/runtime/quickjs.zig zig/src/render/scene_renderer.zig docs/notes/m3-test-error.txt
          git commit -m "fix: preserve QuickJS and layout compatibility"
          git push
