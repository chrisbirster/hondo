name: Diagnose M3

on:
  push:
    branches: [feature/m3-layout-primitives]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@12.0.2
      - run: npm install
      - name: Run Zig tests or capture diagnostics
        shell: bash
        run: |
          set +e
          zig build test > /tmp/m3-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          cp /tmp/m3-test.log docs/notes/m3-test-error.txt
          git config user.name "hondo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/notes/m3-test-error.txt
          git commit -m "ci: capture M3 Zig test diagnostics"
          git push
          exit "$status"
