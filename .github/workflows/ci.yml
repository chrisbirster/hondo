name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm
        run: npm install --global npm@12.0.2

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check Zig formatting
        run: zig fmt --check zig build.zig

      - name: Test Zig and embedded Solid bundle
        run: zig build test

      - name: Run counter executable smoke
        run: zig build counter-smoke

      - name: Run counter PTY lifecycle smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zig build install
          printf '\r' | script -qefc "./zig-out/bin/hondo-counter --once" /tmp/hondo-pty.log
          node -e "const fs=require('fs'); const d=fs.readFileSync('/tmp/hondo-pty.log'); for (const n of ['\u001b[?1049h','Count: 0','Count: 1','\u001b[?25h','\u001b[?1049l']) { if (!d.includes(Buffer.from(n))) throw new Error('missing PTY marker: '+JSON.stringify(n)); }"

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Test TypeScript
        run: npm test
